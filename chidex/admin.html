<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Chidex Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .admin-top { background: var(--ink); color: var(--paper); }
    .admin-top .header-row { height: 62px; }
    .admin-top .logo-word small { color: #aeb4cc; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 16px 0; }
    .tab { height: 40px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; white-space: nowrap; }
    .tab.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px; }
    @media (min-width: 800px) { .stats { grid-template-columns: repeat(4, 1fr); } }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
    .stat small { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; color: var(--muted); }
    .stat b { display: block; font-family: var(--display); font-size: 26px; }
    .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 720px; }
    th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); background: var(--paper-2); position: sticky; top: 0; }
    tr:last-child td { border-bottom: 0; }
    td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--paper-2); }
    .pill.Paid { background: #fff1c2; } .pill.Packed { background: #dfe7f7; } .pill.Ready, .pill.Dispatched { background: #e4dcf5; }
    .pill.Completed { background: #d6efdf; color: #1e5b3f; } .pill.Cancelled { background: #fde1de; color: var(--thread); }
    .row-actions { display: flex; gap: 6px; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
    .bar input[type=search], .bar select { height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); padding: 0 12px; }
    .bar input[type=search] { flex: 1; min-width: 200px; }
    .gate { max-width: 380px; margin: 12vh auto; }
    .modal-card.wide { width: min(640px, 100%); }
    .order-lines td, .order-lines th { padding: 8px 10px; }
    .note { font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="admin-top">
    <div class="wrap header-row">
      <a class="logo" href="index.html" style="color:var(--paper)"><span class="logo-mark">C</span><span class="logo-word">CHIDEX<small>Store admin</small></span></a>
      <div class="header-actions"><a class="btn small tape" href="index.html" target="_blank">View store</a><button class="btn small ghost" id="logout" style="color:var(--paper);border-color:#6d7393" hidden>Log out</button></div>
    </div>
  </header>
  <main class="wrap" id="admin"></main>
  <div class="modal" id="modal"><div class="modal-card" id="modal-card"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
