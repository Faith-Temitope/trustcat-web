<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chidex — Sewing Materials, Retail & Wholesale | Kogi State</title>
  <meta name="description" content="Order threads, zips, linings, laces, stones and tailoring tools from Chidex. Buy ₦100,000 and above and every item drops to wholesale price. Pickup or delivery across Kogi State." />
  <meta name="theme-color" content="#1b2340" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="strip" id="strip"></div>

  <header class="header">
    <div class="wrap">
      <div class="header-row">
        <a class="logo" href="#/" aria-label="Chidex home">
          <span class="logo-mark">C</span>
          <span class="logo-word">CHIDEX<small>Sewing materials</small></span>
        </a>
        <form class="search" role="search" data-search>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" name="q" placeholder="Search threads, zips, lace, Aba lining…" aria-label="Search products" />
        </form>
        <nav class="nav" aria-label="Main">
          <a href="#/shop" data-nav="shop">Shop</a>
          <a href="#/wholesale" data-nav="wholesale">Wholesale</a>
          <a href="#/about" data-nav="about">About</a>
        </nav>
        <div class="header-actions">
          <button class="icon-btn" data-open-cart aria-label="Open cart">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
            <span class="badge" id="cart-count" hidden>0</span>
          </button>
          <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
          </button>
        </div>
      </div>
      <div class="mobile-search">
        <form class="search" role="search" data-search>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" name="q" placeholder="Search products…" aria-label="Search products" />
        </form>
      </div>
      <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile">
        <a href="#/shop">Shop all</a>
        <a href="#/wholesale">How wholesale works</a>
        <a href="#/about">About & contact</a>
      </nav>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div class="wrap">
      <div class="footer-grid">
        <div>
          <span class="logo-word">CHIDEX</span>
          <p id="foot-about" style="max-width:380px"></p>
        </div>
        <div>
          <h4>Shop</h4>
          <div id="foot-cats"></div>
        </div>
        <div>
          <h4>Visit / contact</h4>
          <div id="foot-contact"></div>
        </div>
      </div>
      <div class="footer-base">
        <span>© <span id="year"></span> Chidex. All rights reserved.</span>
        <span>Payments secured by Paystack · <a href="admin.html" style="display:inline">Staff login</a></span>
      </div>
    </div>
  </footer>

  <!-- Cart drawer -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Cart" aria-hidden="true">
    <div class="drawer-head">
      <h3>Your cart</h3>
      <button class="icon-btn" data-close-cart aria-label="Close cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer-meter" id="drawer-meter"></div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-foot" id="drawer-foot"></div>
  </aside>

  <div class="modal" id="modal"><div class="modal-card" id="modal-card"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <a class="wa-float" id="wa-float" target="_blank" rel="noopener" aria-label="Chat with Chidex on WhatsApp">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.7-1.2 2.2 2.2 0 0 0 .2-1.2c-.1-.1-.3-.2-.5-.3z"/></svg>
  </a>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
